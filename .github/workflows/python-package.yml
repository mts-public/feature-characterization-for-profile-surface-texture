name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Copy license into the package directory
        run: cp LICENSE python/

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build python/
          twine check --strict python/dist/*

      - name: Install wheel and import package
        # cd away from the checkout + check import
        run: |
          python -m pip install python/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import featurecharacterization2d as fc; print(fc.__all__)"

      - name: Run tests against the installed wheel
        # MATLAB reference values: matlab/tests/generate_reference_values.m
        run: |
          python -m pip install pytest
          python -m pytest python/tests -rxX
